# The LOCAL end-to-end topology: Caddy + the token API + Y-Sweet, on :8080.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# The overlay adds MinIO as the S3 stand-in and throwaway dev credentials, so
# no .env, domain or S3 account is needed. That pair is what `scripts/e2e.sh
# --stack` and .github/workflows/e2e-run.yml bring up, and it is the only thing
# this file is for.
#
# PRODUCTION IS NOT HERE. The box that serves the boards is described by
# https://github.com/jacobanana/mixedmode-deploy - `stacks/mathsboard` there,
# alongside the other apps sharing it. What used to be in this file and is now
# that repo's: Caddy's 80/443 and automatic TLS (its `edge` stack, one proxy for
# every app), and Umami with its Postgres and backup sidecar (its platform
# tier, so analytics no longer restarts when this app deploys).
#
# The two shapes differ in one way that matters when reading deploy/Caddyfile:
# there is no edge proxy in front of this stack, so its Caddy does everything -
# static files, /api and /ys - on one plain-HTTP site. In production the image
# serves files and nothing else (deploy/web.Caddyfile).

services:
  web:
    # Built from source here; production pulls the image CI publishes to GHCR.
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Over the image's baked deploy/web.Caddyfile: this stack needs the
      # local-only config that also proxies /api and /ys.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - ysweet

  api:
    build: ./server
    restart: unless-stopped
    # Every value has a dev default in the overlay; required:false lets this run
    # without a .env at all.
    env_file:
      - path: .env
        required: false
    depends_on:
      - ysweet

  ysweet:
    image: ghcr.io/jamsocket/y-sweet:latest
    restart: unless-stopped
    # The image has no ENTRYPOINT, so `command` must name the binary itself
    # (default CMD is ["y-sweet", ...]). Without "y-sweet" here Docker tries to
    # exec "serve" directly and fails: `exec: "serve": executable file not found`.
    command: ["y-sweet", "serve", "--prod"]
    env_file:
      - path: .env
        required: false
    environment:
      # Reachable from the other containers (the binary binds 127.0.0.1 by
      # default); never published on the host - only Caddy talks to it.
      Y_SWEET_HOST: 0.0.0.0
      PORT: "8080"
