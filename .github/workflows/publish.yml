# Build the two app images (web + api) on GitHub's runners, push them to the
# GitHub Container Registry (public), then ask the deploy repo to roll the box
# over. The box never builds - it only pulls. GHCR push uses the built-in
# GITHUB_TOKEN, so no registry secret is needed.
#
# This repo no longer knows how to reach the server. The box runs several apps
# now and is described by https://github.com/jacobanana/mixedmode-deploy, which
# is the only place holding an SSH key to it; this workflow's last step names
# the images it just published and hands over. The deployed version is recorded
# there as a commit, so a rollback is a revert in that repo rather than a
# re-run of this one.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   DEPLOY_DISPATCH_TOKEN   fine-grained PAT, Actions: read and write, scoped to
#                           jacobanana/mixedmode-deploy and nothing else

name: Publish & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Defined once and read by both the build and the dispatch, so the tag that is
  # pushed and the tag that is deployed cannot drift. The full sha rather than a
  # short one: nothing has to agree on how many characters "short" means.
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # Fast unit suite first (shared with e2e.yml / deploy.yml via the reusable
  # workflow): a logic regression fails here in ~2 minutes and skips the whole
  # 30-min e2e + build + deploy chain.
  unit:
    uses: ./.github/workflows/unit-run.yml

  # Collaboration e2e suite (shared with e2e.yml via the reusable workflow).
  # build gates on it, so a red suite blocks image build/push and the VPS
  # rollover entirely - nothing untested is ever published. A red/skipped e2e
  # also blocks deploy via its explicit `needs.e2e.result == 'success'` check,
  # so the unit gate propagates all the way down.
  e2e:
    needs: unit
    uses: ./.github/workflows/e2e-run.yml

  # Decide what actually changed so a frontend-only or server-only push doesn't
  # rebuild both images. Runs in parallel with e2e (it's a cheap git diff); the
  # build gate on e2e still holds because build needs both jobs.
  #
  # Path detection compares only the commits in *this* push, not against what is
  # currently deployed - so if an earlier image change never deployed (e.g. a
  # failed run) a later unrelated push won't pick it up. workflow_dispatch is the
  # escape hatch: a manual run forces a full rebuild of both images.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}   # build matrix of only changed images
      build: ${{ steps.set.outputs.build }}      # 'true' if any image needs rebuilding
      web: ${{ steps.set.outputs.web }}          # 'true' if the web image was rebuilt
      api: ${{ steps.set.outputs.api }}          # 'true' if the api image was rebuilt
    steps:
      - uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # web mirrors the COPY set in deploy/Dockerfile.web - keep in sync.
            web:
              - 'src/**'
              - 'public/**'
              - 'language/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'deploy/Dockerfile.web'
              # Production routing is baked into the image now, so changing it
              # is an image rebuild rather than a config copy to the box.
              - 'deploy/web.Caddyfile'
              # Not COPYed into the image - read by this workflow below and
              # baked into the bundle as build-args. Listed anyway: an analytics
              # value that changes without a rebuild changes nothing at all.
              - 'deploy/analytics.env'
            api:
              - 'server/**'

      # The tracker URL and each board's website id, baked into the bundle at
      # build time. Committed (deploy/analytics.env) rather than held as repo
      # variables: the URL has to track the deploy repo's analytics hostname,
      # and when that moved, a stale variable pointed the bundle at a host
      # nothing served - which looks like "no traffic", not like an error.
      # Grepped, never sourced: it is data, not a shell script.
      - name: Read the analytics config
        run: grep -E '^UMAMI_[A-Z_]*=' deploy/analytics.env >> "$GITHUB_ENV"

      - name: Assemble build matrix
        id: set
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          WEB: ${{ steps.filter.outputs.web }}
          API: ${{ steps.filter.outputs.api }}
        run: |
          web=$WEB
          api=$API
          if [ "$FORCE" = "true" ]; then
            web=true
            api=true
          fi
          include='[]'
          if [ "$web" = "true" ]; then
            include=$(jq -cn --argjson a "$include" \
              --arg src "$UMAMI_SRC" --arg id "$UMAMI_WEBSITE_ID" --arg lang "$UMAMI_LANGUAGE_WEBSITE_ID" \
              '$a + [{"image":"web","context":".","dockerfile":"deploy/Dockerfile.web","buildArgs":"UMAMI_SRC=\($src)\nUMAMI_WEBSITE_ID=\($id)\nUMAMI_LANGUAGE_WEBSITE_ID=\($lang)"}]')
          fi
          if [ "$api" = "true" ]; then
            include=$(jq -cn --argjson a "$include" \
              '$a + [{"image":"api","context":"server","dockerfile":"server/Dockerfile","buildArgs":""}]')
          fi
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          if [ "$include" = "[]" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          # A deploy is now exactly "an image was rebuilt". The config that used
          # to need a copy to the box without one - the compose file, the
          # Caddyfile - is either local-only or lives in the deploy repo, which
          # deploys itself when it changes.
          echo "web=$web api=$api force=$FORCE -> $include"

  build:
    needs: [e2e, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: version
        uses: ./.github/actions/app-version

      # Buildx's docker-container driver is required for the type=gha cache
      # export below (the default docker driver can't export cache).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both Dockerfiles declare ARG APP_VERSION; web maps it to
          # VITE_APP_VERSION, api reads it at runtime. matrix.buildArgs carries
          # per-image extras (the web image's Umami tracker URL and the two
          # boards' website ids); it's an empty line for the api image, which
          # build-push-action ignores.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ matrix.buildArgs }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [e2e, changes, build]
    runs-on: ubuntu-latest
    # Only auto-deploy from main; PRs and forks never reach the server. e2e must
    # have passed, and the build must have succeeded - unlike the SSH rollover
    # this replaces, there is no case where nothing was built and the box still
    # needs a visit, so this is a plain `needs` rather than an always() with the
    # gates re-imposed by hand.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.changes.outputs.build == 'true'
    steps:
      - name: Ask the deploy repo to roll the stack over
        env:
          # Fine-grained PAT with Actions: read and write on mixedmode-deploy
          # only. Narrower than a repository_dispatch token, which would need
          # Contents: write - the right to push to the repo that describes
          # every app on the box.
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          WEB: ${{ needs.changes.outputs.web }}
          API: ${{ needs.changes.outputs.api }}
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          # Only what this run actually published. The deploy repo merges these
          # into versions/mathsboard.env rather than replacing it, so the image
          # that was not rebuilt keeps the reference it already had.
          images=""
          if [ "$WEB" = "true" ]; then
            images="$images MATHSBOARD_WEB_IMAGE=$REGISTRY-web:$IMAGE_TAG"
          fi
          if [ "$API" = "true" ]; then
            images="$images MATHSBOARD_API_IMAGE=$REGISTRY-api:$IMAGE_TAG"
          fi
          images="${images# }"
          echo "dispatching: $images"

          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/jacobanana/mixedmode-deploy/actions/workflows/deploy.yml/dispatches \
            -d "$(jq -cn --arg images "$images" \
                  '{ref: "main", inputs: {stack: "mathsboard", images: $images}}')"

  # Record every successful deploy as a GitHub Release, tagged with the same
  # CalVer+sha version baked into the images. needs: deploy means it only runs
  # when a deploy actually happened (skipped/failed deploy -> no release). Tag
  # pushes don't match this workflow's push:branches trigger, so no loop.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: version
        uses: ./.github/actions/app-version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          # Re-runs of the same commit would clash on the tag; treat as a no-op.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, skipping"
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
